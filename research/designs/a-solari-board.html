<!doctype html>
<html lang="en" data-theme="amber">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iFlight · Solari Departures Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DIRECTION A — "Solari Departures Board"
     Subject: the mechanical split-flap board at the airport gate.
     Signature: each character lives in its own flap tile with a
     horizontal seam; data flips into place on load (staggered).
     Accents carry MEANING: amber=boarding/active, green=on-time,
     muted=landed/past, red=cancelled.
     ============================================================ */

  :root[data-theme="amber"] {
    --board:    #08090b;
    --vignette: rgba(255,176,0,0.06);
    --tile:     #161310;
    --tile-2:   #1d1916;
    --seam:     rgba(0,0,0,0.55);
    --char:     #f4efe6;     /* default ivory characters */
    --char-dim: #6f6a60;
    --accent:   #ffb000;     /* amber phosphor */
    --ok:       #4ad07a;
    --warn:     #ffb000;
    --bad:      #ff5d4d;
    --rule:     rgba(255,255,255,0.07);
    --head:     #ffb000;
  }
  :root[data-theme="frankfurt"] {
    --board:    #0c0c0d;
    --vignette: rgba(255,255,255,0.04);
    --tile:     #1a1a1c;
    --tile-2:   #232326;
    --seam:     rgba(0,0,0,0.6);
    --char:     #f2f2f0;
    --char-dim: #6b6b6e;
    --accent:   #ffd400;     /* signage yellow */
    --ok:       #5fd08a;
    --warn:     #ffd400;
    --bad:      #ff6a5a;
    --rule:     rgba(255,255,255,0.08);
    --head:     #f2f2f0;
  }
  :root[data-theme="cream"] {
    --board:    #0a0805;
    --vignette: rgba(237,230,214,0.05);
    --tile:     #18140d;
    --tile-2:   #211b12;
    --seam:     rgba(0,0,0,0.55);
    --char:     #ede6d6;     /* vintage Italian Solari ivory */
    --char-dim: #74695a;
    --accent:   #e8c879;     /* aged brass */
    --ok:       #8fc98a;
    --warn:     #e8c879;
    --bad:      #e0796a;
    --rule:     rgba(237,230,214,0.08);
    --head:     #ede6d6;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Saira Condensed', sans-serif;
    background:
      radial-gradient(120% 80% at 80% -10%, var(--vignette), transparent 60%),
      radial-gradient(120% 90% at 10% 110%, var(--vignette), transparent 55%),
      var(--board);
    color: var(--char);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding: clamp(16px, 4vw, 48px);
    transition: background 0.4s ease, color 0.4s ease;
  }

  .board {
    max-width: 1080px;
    margin: 0 auto;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: linear-gradient(180deg, rgba(255,255,255,0.015), transparent);
    box-shadow: 0 40px 120px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden;
  }

  /* ---- header --------------------------------------------------- */
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 22px clamp(16px, 3vw, 34px) 16px;
    border-bottom: 1px solid var(--rule);
  }
  .head__title {
    font-weight: 800;
    font-size: clamp(26px, 5vw, 46px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--head);
    line-height: 0.95;
  }
  .head__sub {
    display: block;
    font-size: 0.34em;
    letter-spacing: 0.42em;
    color: var(--char-dim);
    font-weight: 600;
    margin-top: 6px;
  }
  .head__right { text-align: right; }
  .clock {
    font-family: 'DM Mono', monospace;
    font-size: clamp(22px, 4vw, 34px);
    color: var(--accent);
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }
  .head__loc {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.28em;
    color: var(--char-dim);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .live {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); margin-right: 7px; vertical-align: middle;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

  /* ---- column legend -------------------------------------------- */
  .cols {
    display: grid;
    grid-template-columns: 90px 1fr 86px 56px 132px;
    gap: 14px;
    padding: 12px clamp(16px, 3vw, 34px);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--char-dim);
    border-bottom: 1px solid var(--rule);
  }
  .cols span:nth-child(3), .cols span:nth-child(4) { text-align: center; }

  /* ---- rows ----------------------------------------------------- */
  .rows { padding: 8px clamp(16px, 3vw, 34px) 18px; }
  .row {
    display: grid;
    grid-template-columns: 90px 1fr 86px 56px 132px;
    gap: 14px;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--rule);
  }
  .row:last-child { border-bottom: 0; }

  /* a single split-flap tile */
  .flaps { display: flex; gap: 3px; flex-wrap: nowrap; }
  .flaps--center { justify-content: center; }
  .flap {
    position: relative;
    min-width: 0.82em;
    padding: 3px 1px 4px;
    text-align: center;
    background: linear-gradient(180deg, var(--tile-2), var(--tile));
    border-radius: 2px;
    font-family: 'DM Mono', monospace;
    font-size: clamp(13px, 1.7vw, 17px);
    line-height: 1;
    color: var(--cellcolor, var(--char));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 1px 2px rgba(0,0,0,0.4);
    transform-origin: center;
    animation: flip 0.42s cubic-bezier(0.2,0.7,0.3,1) backwards;
  }
  /* the horizontal fold seam of a real flap */
  .flap::after {
    content: ""; position: absolute; left: 0; right: 0; top: 50%;
    height: 1px; background: var(--seam); transform: translateY(-0.5px);
  }
  .flap--space { background: transparent; box-shadow: none; }
  .flap--space::after { display: none; }

  @keyframes flip {
    0%   { transform: rotateX(-90deg); opacity: 0; }
    55%  { transform: rotateX(12deg);  opacity: 1; }
    100% { transform: rotateX(0deg); }
  }

  /* status colouring (meaning-bearing) */
  .st-boarding { --cellcolor: var(--accent); }
  .st-boarding .flap { box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 0 10px color-mix(in srgb, var(--accent) 35%, transparent); }
  .st-ontime   { --cellcolor: var(--ok); }
  .st-landed   { --cellcolor: var(--char-dim); }
  .st-sched    { --cellcolor: var(--char); }
  .st-delayed  { --cellcolor: var(--warn); }
  .st-cancel   { --cellcolor: var(--bad); }
  .blink { animation: blink 1.1s steps(2,start) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }

  .gate { font-family:'DM Mono',monospace; text-align:center; color: var(--char); font-size: clamp(13px,1.7vw,17px); }
  .meta { font-family:'DM Mono',monospace; text-align:center; color: var(--char-dim); font-size: clamp(12px,1.6vw,15px); font-variant-numeric: tabular-nums;}

  /* ---- footer / legend ------------------------------------------ */
  .foot {
    display: flex; flex-wrap: wrap; gap: 18px 26px;
    padding: 14px clamp(16px,3vw,34px);
    border-top: 1px solid var(--rule);
    font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.14em;
    color: var(--char-dim); text-transform: uppercase;
  }
  .key { display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 2px; }

  /* ---- theme switcher ------------------------------------------- */
  .switch {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 7px;
    background: rgba(12,12,14,0.82); backdrop-filter: blur(8px);
    border: 1px solid var(--rule); border-radius: 999px; z-index: 50;
    font-family: 'DM Mono', monospace;
  }
  .switch button {
    border: 0; cursor: pointer; padding: 7px 15px; border-radius: 999px;
    background: transparent; color: var(--char-dim); font-size: 11px;
    letter-spacing: 0.14em; text-transform: uppercase; font-family: inherit;
    transition: all 0.18s ease;
  }
  .switch button[aria-pressed="true"] { background: var(--accent); color: #111; font-weight: 500; }
  .switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tag {
    position: fixed; top: 14px; left: 16px; z-index: 50;
    font-family:'DM Mono',monospace; font-size: 11px; letter-spacing: 0.2em;
    color: var(--char-dim); text-transform: uppercase;
  }
  .tag b { color: var(--accent); font-weight: 500; }

  @media (max-width: 720px) {
    .cols span:nth-child(3), .cols span:nth-child(4) { display:none; }
    .row .meta:nth-of-type(1), .row .gate { display:none; }
    .cols, .row { grid-template-columns: 78px 1fr 120px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .flap { animation: none !important; }
    .live, .blink { animation: none !important; }
  }
</style>
</head>
<body>
  <div class="tag">iFlight · direction <b>A — Solari board</b></div>

  <div class="board" role="region" aria-label="Flight departures board">
    <div class="head">
      <div class="head__title">Departures<span class="head__sub">Le mie tratte · my flights</span></div>
      <div class="head__right">
        <div class="clock"><span class="live" aria-hidden="true"></span><span id="clock">--:--:--</span></div>
        <div class="head__loc">Home base · LHR London</div>
      </div>
    </div>

    <div class="cols">
      <span>Flight</span><span>Destination</span><span>Dep</span><span>Gate</span><span>Status</span>
    </div>

    <div class="rows" id="rows"></div>

    <div class="foot">
      <span class="key"><span class="dot" style="background:var(--accent)"></span>Boarding</span>
      <span class="key"><span class="dot" style="background:var(--ok)"></span>On&nbsp;time</span>
      <span class="key"><span class="dot" style="background:var(--char-dim)"></span>Landed</span>
      <span class="key"><span class="dot" style="background:var(--bad)"></span>Cancelled</span>
      <span style="margin-left:auto">7 sectors · 49,100 km flown</span>
    </div>
  </div>

  <nav class="switch" aria-label="Theme">
    <button data-theme="amber"    aria-pressed="true">Amber phosphor</button>
    <button data-theme="frankfurt" aria-pressed="false">Signage white</button>
    <button data-theme="cream"    aria-pressed="false">Vintage Solari</button>
  </nav>

<script>
  // ---- realistic flight data (matches iFlight's Flight shape) -----
  const FLIGHTS = [
    { no:"BA 117",  dest:"NEW YORK JFK",    dep:"14:30", gate:"07", status:"boarding"  },
    { no:"LH 901",  dest:"FRANKFURT FRA",   dep:"07:00", gate:"22", status:"landed"    },
    { no:"VS 25",   dest:"LOS ANGELES LAX", dep:"11:00", gate:"31", status:"landed"    },
    { no:"AF1281",  dest:"ROME FIUMICINO",  dep:"09:50", gate:"14", status:"landed"    },
    { no:"SQ 317",  dest:"SINGAPORE SIN",   dep:"22:15", gate:"03", status:"landed"    },
    { no:"UA 930",  dest:"SAN FRANCISCO",   dep:"16:25", gate:"45", status:"landed"    },
    { no:"QF 001",  dest:"SYDNEY KSA",      dep:"21:40", gate:"--", status:"scheduled" },
  ];

  const STATUS_LABEL = {
    boarding:"BOARDING", landed:"LANDED", scheduled:"SCHEDULED",
    ontime:"ON TIME", delayed:"DELAYED", cancelled:"CANCELLED"
  };
  const STATUS_CLASS = {
    boarding:"st-boarding", landed:"st-landed", scheduled:"st-sched",
    ontime:"st-ontime", delayed:"st-delayed", cancelled:"st-cancel"
  };

  // turn a string into split-flap tiles, with a global stagger counter
  let cellIndex = 0;
  function flaps(text, opts = {}) {
    const { center=false, len=null, blink=false } = opts;
    let str = text.toUpperCase();
    if (len) str = str.padEnd(len, " ").slice(0, len);
    const wrap = document.createElement("div");
    wrap.className = "flaps" + (center ? " flaps--center" : "");
    [...str].forEach(ch => {
      const cell = document.createElement("span");
      cell.className = "flap" + (ch === " " ? " flap--space" : "") + (blink ? " blink" : "");
      cell.textContent = ch === " " ? " " : ch;
      cell.style.animationDelay = (cellIndex++ * 0.012) + "s";
      wrap.appendChild(cell);
    });
    return wrap;
  }

  function render() {
    cellIndex = 0;
    const rows = document.getElementById("rows");
    rows.innerHTML = "";
    FLIGHTS.forEach(f => {
      const row = document.createElement("div");
      row.className = "row " + STATUS_CLASS[f.status];
      // flight no
      row.appendChild(flaps(f.no.replace(" ",""), { len:5 }));
      // destination
      row.appendChild(flaps(f.dest, { len:16 }));
      // dep time (plain mono, not flapped, to vary rhythm)
      const dep = document.createElement("div"); dep.className="meta"; dep.textContent=f.dep;
      row.appendChild(dep);
      // gate
      const gate = document.createElement("div"); gate.className="gate"; gate.textContent=f.gate;
      row.appendChild(gate);
      // status (flapped, boarding blinks)
      row.appendChild(flaps(STATUS_LABEL[f.status], { len:9, blink: f.status==="boarding" }));
      rows.appendChild(row);
    });
  }

  // live clock
  function tick() {
    const d = new Date();
    const p = n => String(n).padStart(2,"0");
    document.getElementById("clock").textContent = `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  }
  tick(); setInterval(tick, 1000);
  render();

  // theme switching re-triggers the flip cascade
  document.querySelector(".switch").addEventListener("click", e => {
    const btn = e.target.closest("button"); if (!btn) return;
    document.documentElement.dataset.theme = btn.dataset.theme;
    document.querySelectorAll(".switch button").forEach(b =>
      b.setAttribute("aria-pressed", b === btn));
    render();
  });
</script>
</body>
</html>
